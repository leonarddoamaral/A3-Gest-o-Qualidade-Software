services:
  db:
    image: postgres:16-alpine
    container_name: vitalsenior-db
    environment:
      POSTGRES_DB: vitalsenior
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./demo
    container_name: vitalsenior-api
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/vitalsenior
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./vital-senior
    container_name: vitalsenior-web
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: