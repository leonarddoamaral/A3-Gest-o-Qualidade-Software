# Perfil usado pelos testes de integração (*IT).
# Aponta para um Postgres DEDICADO a testes: o schema é recriado a cada execução.
# Local:  docker compose --profile test up -d --wait db-test   (porta 5433)
# CI:     service container do GitHub Actions (variáveis TEST_DB_*)
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/vitalsenior_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:anima123}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.flyway.enabled=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false