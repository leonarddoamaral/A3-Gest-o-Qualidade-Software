name: CI/CD

on:
  push:
    branches: [infra]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_VERSION: "17"

jobs:
  # 1) Testes unitários: rápidos, sem banco (Mockito + MockMvc standalone)
  unit-tests:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Executar testes unitários
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-unitarios
          path: target/surefire-reports
          if-no-files-found: ignore

  # 2) Testes de integração: aplicação completa + Postgres real
  integration-tests:
    name: Testes de integração (Postgres)
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vitalsenior_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vitalsenior_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/vitalsenior_test
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # `verify` roda surefire (unitários) + failsafe (*IT) e falha o job se algum teste falhar
      - name: Executar testes de integração
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-testes-integracao
          path: |
            target/surefire-reports
            target/failsafe-reports
          if-no-files-found: ignore

  # 3) Valida Dockerfile + docker-compose: backend sobe e conversa com o Postgres
  docker-smoke-test:
    name: Smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4

      - name: Subir backend + Postgres
        run: docker compose up -d --build

      - name: Aguardar API responder (prova a conexão backend -> banco)
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8081/vitalsenior/exercicios; then
              echo; echo "API respondeu com sucesso"; exit 0
            fi
            sleep 3
          done
          echo "API não respondeu a tempo"
          docker compose ps
          docker compose logs backend db
          exit 1

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar ambiente
        if: always()
        run: docker compose down -v
  
  deploy:
    name: Deploy Azure VM
    runs-on: ubuntu-latest

    needs:
      - docker-smoke-test

    # Não realizar deploy em pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/infra'

    steps:
      - name: Executar deploy na Azure VM
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AZURE_VM_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.AZURE_VM_KNOWN_HOSTS }}
          VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          VM_USER: ${{ secrets.AZURE_VM_USER }}
          DEPLOY_BRANCH: infra

        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh -i ~/.ssh/id_ed25519 \
            "$VM_USER@$VM_HOST" \
            "bash /opt/vitalsenior/scripts/deploy.sh $DEPLOY_BRANCH"